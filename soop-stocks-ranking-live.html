<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SOOP STOCK - 실시간 주가 / 코인 랭킹</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ── 헤더 ── */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .header-left  { display: flex; align-items: center; gap: 12px; }
        .header-title { font-size: 18px; font-weight: 800; color: #f8fafc; }
        .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #64748b; }

        .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: live-blink 1s infinite; }
        .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #ef4444; }
        @keyframes live-blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── 컨트롤 바 ── */
        .control-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 24px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .control-left  { display: flex; gap: 8px; align-items: center; }
        .control-right { font-size: 12px; color: #64748b; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; transition: 0.2s; font-family: 'Pretendard', sans-serif; }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-start  { background: #22c55e; color: white; padding: 8px 16px; font-size: 13px; }
        .btn-stop   { background: #ef4444; color: white; padding: 8px 16px; font-size: 13px; }
        .btn-back   { background: #334155; color: #94a3b8; padding: 8px 14px; font-size: 12px; }
        .rank-market-toggle-wrap,
        .rank-scope-toggle-wrap {
            padding: 10px 24px 8px;
            border-bottom: 1px solid #1e293b;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .rank-scope-toggle-wrap {
            padding-top: 4px;
        }
        .rank-scope-label {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .rank-market-toggle {
            display: inline-flex;
            gap: 4px;
            background: #111c32;
            border: 1px solid #334155;
            border-radius: 999px;
            padding: 4px;
        }
        .rank-market-btn {
            background: transparent;
            color: #94a3b8;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 800;
            min-width: 74px;
        }
        .rank-market-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        /* ── 랭킹 테이블 (좌우 5:5) ── */
        .dual-rank-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 24px 24px;
        }
        .dual-rank-scroll::-webkit-scrollbar { width: 6px; }
        .dual-rank-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .dual-rank-row {
            display: flex;
            gap: 0;
            align-items: flex-start;
            min-height: 100%;
        }
        .dual-rank-row.challenge-stock-only #stock-rank-col {
            flex: 0 0 50%;
            max-width: 50%;
        }
        .rank-col {
            flex: 1;
            min-width: 0;
            padding: 0 12px;
        }
        .rank-col:first-child {
            padding-left: 0;
            border-right: 1px solid #1e293b;
        }
        .rank-col:last-child {
            padding-right: 0;
        }
        .rank-col-title {
            font-size: 13px;
            font-weight: 800;
            color: #38bdf8;
            padding: 10px 0 4px;
            letter-spacing: -0.02em;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
        thead th {
            background: #1e293b; color: #38bdf8;
            padding: 12px 16px; text-align: left;
            font-weight: 800; font-size: 12px;
            position: sticky; top: 0; z-index: 10;
            border-bottom: 1px solid #334155;
        }
        tbody tr { border-bottom: 1px solid #1e293b; transition: background 0.15s; }
        tbody tr:hover { background: rgba(56,189,248,0.05); }
        tbody td { padding: 10px 16px; }

        .rank-no    { width: 48px; font-weight: 800; color: #64748b; font-size: 13px; }
        .rank-no.top3 { color: #f59e0b; font-size: 18px; }
        .stock-name { font-weight: 700; font-size: 15px; }
        .price      { text-align: right; font-weight: 700; font-size: 15px; }
        .change     { text-align: right; font-weight: 700; font-size: 13px; }
        .volume     { text-align: right; color: #64748b; font-size: 13px; }
        .price-up   { color: #ef4444; }
        .price-down { color: #3b82f6; }
        .price-flat { color: #64748b; }

        /* ── 상태 ── */
        .status-empty { text-align: center; padding: 40px 8px; color: #475569; font-size: 14px; }

        @media (max-width: 900px) {
            .dual-rank-row { flex-direction: column; }
            .rank-col:first-child {
                border-right: none;
                border-bottom: 1px solid #1e293b;
                padding-bottom: 16px;
                margin-bottom: 8px;
            }
            .rank-col { padding: 0; }
        }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 14px;
            }
            .header-title {
                font-size: 16px;
            }
            .header-right {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px 10px;
                font-size: 11px;
            }
            .header-right #update-time {
                grid-column: 1 / -1;
            }
            .header-right .auto-scroll-badge {
                grid-column: 1 / -1;
                justify-self: start;
            }
            .control-bar {
                padding: 8px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .control-left {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
            }
            .control-left button {
                width: 100%;
                padding: 9px 8px;
                font-size: 12px;
            }
            .control-right {
                font-size: 11px;
                line-height: 1.45;
            }
            .rank-market-toggle-wrap,
            .rank-scope-toggle-wrap {
                display: block;
                padding: 8px 12px;
            }
            .rank-market-toggle {
                width: 100%;
            }
            .rank-market-btn {
                flex: 1;
            }
            .dual-rank-scroll {
                padding: 0 10px 16px;
            }
            .rank-col {
                padding: 0;
            }
            .rank-col-title {
                font-size: 12px;
                padding: 8px 0 2px;
            }
            table {
                margin-top: 6px;
                font-size: 12px;
            }
            thead th,
            tbody td {
                padding: 9px 8px;
            }
            .stock-name,
            .price {
                font-size: 13px;
            }
            .change,
            .volume,
            .rank-no {
                font-size: 11px;
            }
            .rank-col.is-hidden-mobile {
                display: none;
            }
            .rank-col.is-mobile-active {
                display: block;
                border-bottom: none !important;
                margin-bottom: 0 !important;
                padding-bottom: 0 !important;
            }
        }

        /* ── 로그인 화면 ── */
        #login-section {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
        }
        .login-box { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .btn-google { background: white; color: #334155; display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 12px 20px; }

        #main-section { display: none; flex-direction: column; flex: 1; overflow: hidden; }

        /* ── 자동 스크롤 상태 표시 ── */
        .auto-scroll-badge {
            display: flex; align-items: center; gap: 6px;
            background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #22c55e;
            cursor: pointer; transition: 0.2s;
        }
        .auto-scroll-badge.paused {
            background: rgba(100,116,139,0.1); border-color: rgba(100,116,139,0.3); color: #64748b;
        }
        .auto-scroll-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: live-blink 1s infinite; }
        .auto-scroll-badge.paused .auto-scroll-dot { background: #64748b; animation: none; }

        /* Ctrl+Enter: 순위 리스트 전용 화면 */
        body.focus-list-only .header,
        body.focus-list-only .control-bar,
        body.focus-list-only .rank-market-toggle-wrap,
        body.focus-list-only .rank-scope-toggle-wrap {
            display: none !important;
        }
        body.focus-list-only #main-section {
            padding: 0;
        }
        body.focus-list-only .dual-rank-scroll {
            padding: 0 8px 8px;
        }
        body.focus-list-only .rank-col-title {
            padding-top: 6px;
        }
    </style>
</head>
<body>

<!-- 로그인 -->
<div id="login-section">
    <div class="login-box">
        <div style="font-size:22px; font-weight:800; color:#38bdf8;">📊 실시간 주가 / 코인 랭킹</div>
        <p style="color:#94a3b8; font-size:14px;">관리자 또는 열람권이 승인된 계정으로 로그인하세요.</p>
        <button class="btn-google" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Google로 로그인
        </button>
    </div>
</div>

<!-- 메인 -->
<div id="main-section">
    <div class="header">
        <div class="header-left">
            <div class="header-title">📊 SOOP STOCK 실시간 주가 / 코인 랭킹</div>
            <div class="live-badge" id="live-badge" style="display:none;">
                <span class="live-dot"></span> LIVE
            </div>
        </div>
        <div class="header-right">
            <span id="update-time">-</span>
            <span id="stock-count" style="color:#38bdf8; font-weight:700;">-</span>
            <span id="coin-count" style="color:#f59e0b; font-weight:700;">-</span>
            <div class="auto-scroll-badge" id="auto-scroll-badge" onclick="toggleAutoScroll()">
                <span class="auto-scroll-dot"></span>
                <span id="auto-scroll-label">자동 스크롤</span>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <div class="control-left">
            <button class="btn-start" onclick="startRanking()">▶ 구독 시작</button>
            <button class="btn-stop"  onclick="stopRanking()">■ 구독 중단</button>
            <button class="btn-back"  onclick="window.close()">✕ 닫기</button>
        </div>
        <div class="control-right" id="status-text">구독 시작 버튼을 눌러주세요</div>
    </div>
    <div class="rank-market-toggle-wrap">
        <div class="rank-market-toggle" role="tablist" aria-label="랭킹 시장 전환">
            <button type="button" class="rank-market-btn active" id="rank-market-stock-btn" onclick="setRankMarketView('stock')">📈 주식</button>
            <button type="button" class="rank-market-btn" id="rank-market-coin-btn" onclick="setRankMarketView('coin')">🪙 코인</button>
        </div>
    </div>
    <div class="rank-scope-toggle-wrap">
        <div class="rank-scope-label">TOP100 데이터</div>
        <div class="rank-market-toggle" role="tablist" aria-label="메인 또는 챌린지 랭킹">
            <button type="button" class="rank-market-btn active" id="rank-scope-main-btn" onclick="setRankDataScope('main')">메인</button>
            <button type="button" class="rank-market-btn" id="rank-scope-challenge-btn" onclick="setRankDataScope('challenge')">챌린지</button>
        </div>
    </div>

    <div class="dual-rank-scroll" id="dual-rank-scroll">
        <div class="dual-rank-row">
            <div class="rank-col" id="stock-rank-col">
                <div class="rank-col-title">실시간 주가 랭킹</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;">순위</th>
                            <th>종목</th>
                            <th style="text-align:right;">현재가</th>
                            <th style="text-align:right;">등락률</th>
                            <th style="text-align:right;">거래량</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody-stock">
                        <tr><td colspan="5" class="status-empty">구독 시작 버튼을 눌러주세요</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="rank-col" id="coin-rank-col">
                <div class="rank-col-title">실시간 코인 랭킹</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;">순위</th>
                            <th>코인</th>
                            <th style="text-align:right;">현재가</th>
                            <th style="text-align:right;">등락률</th>
                            <th style="text-align:right;">거래량</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody-coin">
                        <tr><td colspan="5" class="status-empty">구독 시작 버튼을 눌러주세요</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDifzxfQaJ7SWQZF1And87xvkT80LmQQk8",
        authDomain: "soop-stock-market.firebaseapp.com",
        databaseURL: "https://soop-stock-market-default-rtdb.firebaseio.com/",
        projectId: "soop-stock-market",
        appId: "1:997788925900:web:cb613d438efec019a3a769"
    };
    const app      = initializeApp(firebaseConfig);
    const db       = getDatabase(app);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();
    const ADMIN_EMAIL = "skftodwocks2@gmail.com";

    let stockTopUnsub = null;
    let coinTopUnsub  = null;
    let metaUnsub = null;
    let rankingActive = false;
    let rankingPausedForHidden = false;
    let rankMarketView = 'stock';
    let rankDataScope = 'main';
    let canViewMainRank = false;
    let canViewChallengeRank = false;

    function rankStocksPath() {
        return rankDataScope === 'challenge' ? 'marketRank/challenge/top100/stocks' : 'marketRank/top100/stocks';
    }
    function rankCoinsPath() {
        return rankDataScope === 'challenge' ? 'marketRank/challenge/top100/coins' : 'marketRank/top100/coins';
    }
    function rankMetaPath() {
        return rankDataScope === 'challenge' ? 'marketRank/challenge/meta/updatedAt' : 'marketRank/meta/updatedAt';
    }

    function applyRankDataScopeButtons() {
        const mainBtn = document.getElementById('rank-scope-main-btn');
        const chBtn = document.getElementById('rank-scope-challenge-btn');
        if (!mainBtn || !chBtn) return;
        mainBtn.style.display = canViewMainRank ? '' : 'none';
        chBtn.style.display = canViewChallengeRank ? '' : 'none';
        mainBtn.classList.toggle('active', rankDataScope === 'main');
        chBtn.classList.toggle('active', rankDataScope === 'challenge');
    }

    window.setRankDataScope = function(scope) {
        const nextScope = scope === 'challenge' ? 'challenge' : 'main';
        if (nextScope === 'main' && !canViewMainRank) return;
        if (nextScope === 'challenge' && !canViewChallengeRank) return;
        rankDataScope = nextScope;
        if (rankDataScope === 'challenge') rankMarketView = 'stock';
        applyRankDataScopeButtons();
        applyRankMarketView();
        if (rankingActive) {
            stopSubscriptionsOnly();
            window.startRanking();
        }
    };

    function isCompactMobileView() {
        return window.matchMedia('(max-width: 768px)').matches;
    }

    function applyRankMarketView() {
        const rowWrap = document.querySelector('.dual-rank-row');
        const stockCol = document.getElementById('stock-rank-col');
        const coinCol = document.getElementById('coin-rank-col');
        const stockBtn = document.getElementById('rank-market-stock-btn');
        const coinBtn = document.getElementById('rank-market-coin-btn');
        if (!stockCol || !coinCol || !stockBtn || !coinBtn) return;
        const challengeStockOnly = rankDataScope === 'challenge';
        if (challengeStockOnly) rankMarketView = 'stock';

        coinBtn.style.display = challengeStockOnly ? 'none' : '';
        coinCol.style.display = challengeStockOnly ? 'none' : '';
        if (rowWrap) rowWrap.classList.toggle('challenge-stock-only', challengeStockOnly && !isCompactMobileView());
        stockCol.style.flex = '';
        stockCol.style.maxWidth = '';

        stockBtn.classList.toggle('active', rankMarketView === 'stock');
        coinBtn.classList.toggle('active', rankMarketView === 'coin');

        if (challengeStockOnly) {
            stockCol.classList.remove('is-hidden-mobile', 'is-mobile-active');
            coinCol.classList.remove('is-hidden-mobile', 'is-mobile-active');
            return;
        }

        if (!isCompactMobileView()) {
            stockCol.classList.remove('is-hidden-mobile', 'is-mobile-active');
            coinCol.classList.remove('is-hidden-mobile', 'is-mobile-active');
            return;
        }
        const showStock = rankMarketView === 'stock';
        stockCol.classList.toggle('is-hidden-mobile', !showStock);
        stockCol.classList.toggle('is-mobile-active', showStock);
        coinCol.classList.toggle('is-hidden-mobile', showStock);
        coinCol.classList.toggle('is-mobile-active', !showStock);
    }

    window.setRankMarketView = function(view) {
        if (rankDataScope === 'challenge' && view === 'coin') return;
        rankMarketView = view === 'coin' ? 'coin' : 'stock';
        applyRankMarketView();
    };

    /** Top100 경량 노드(`marketRank/top100/*`) 전용 렌더러 */
    function buildRankingRows(items, priceUnit, isCoin) {
        const dec = isCoin ? 4 : 2;
        return items.map((s, i) => {
            const rank     = Number(s.rank) || (i + 1);
            const rawCh    = parseFloat(s.change);
            const change   = Number.isFinite(rawCh) ? rawCh : 0;
            const changeCls = change > 0 ? 'price-up' : change < 0 ? 'price-down' : 'price-flat';
            const changeStr = change > 0 ? `+${change.toFixed(dec)}%` : `${change.toFixed(dec)}%`;
            const medal    = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
            const rankCls  = rank <= 3 ? 'top3' : '';
            return `<tr>
                <td class="rank-no ${rankCls}">${medal}</td>
                <td class="stock-name">${s.name || s.id}</td>
                <td class="price ${changeCls}">${(s.price || 0).toLocaleString()}${priceUnit}</td>
                <td class="change ${changeCls}">${changeStr}</td>
                <td class="volume">${(s.volume || 0).toLocaleString()}</td>
            </tr>`;
        }).join('');
    }

    function touchTime(explicitMs = null) {
        const updateEl = document.getElementById('update-time');
        const date = explicitMs ? new Date(explicitMs) : new Date();
        updateEl.textContent = `갱신: ${date.toLocaleTimeString('ko-KR')}`;
    }

    function setStatusText(txt) {
        const statusEl = document.getElementById('status-text');
        if (statusEl) statusEl.textContent = txt;
    }

    function stopSubscriptionsOnly() {
        if (stockTopUnsub) { stockTopUnsub(); stockTopUnsub = null; }
        if (coinTopUnsub) { coinTopUnsub(); coinTopUnsub = null; }
        if (metaUnsub) { metaUnsub(); metaUnsub = null; }
        rankingActive = false;
    }

    async function getRankAccess(user) {
        const out = { main: false, challenge: false };
        if (!user?.uid) return out;
        if (String(user.email || '').toLowerCase() === String(ADMIN_EMAIL).toLowerCase()) {
            out.main = true;
            out.challenge = true;
            return out;
        }
        try {
            const [entSnap, challengeSnap] = await Promise.all([
                get(ref(db, `users/${user.uid}/entitlements/liveRankingTop100ExpiresAt`)),
                get(ref(db, `users/${user.uid}/entitlements/challengeSupporterVerified`))
            ]);
            const expiresAt = Number(entSnap.val() || 0);
            out.main = Number.isFinite(expiresAt) && expiresAt > Date.now();
            out.challenge = challengeSnap.exists() ? challengeSnap.val() === true : false;
            return out;
        } catch (_) {
            return out;
        }
    }

    onAuthStateChanged(auth, async (user) => {
        const access = await getRankAccess(user);
        canViewMainRank = access.main;
        canViewChallengeRank = access.challenge;
        if (canViewMainRank || canViewChallengeRank) {
            if (!canViewMainRank && canViewChallengeRank) rankDataScope = 'challenge';
            if (canViewMainRank && !canViewChallengeRank) rankDataScope = 'main';
            applyRankDataScopeButtons();
            applyRankMarketView();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-section').style.display  = 'flex';
            return;
        }
        document.getElementById('login-section').style.display = 'flex';
        document.getElementById('main-section').style.display  = 'none';
        stopRanking();
    });

    window.login = async function() {
        try { await signInWithPopup(auth, provider); }
        catch(e) { if (e.code !== 'auth/popup-closed-by-user') alert('로그인 실패: ' + e.message); }
    };

    const emptyRow = '<tr><td colspan="5" class="status-empty">데이터 없음</td></tr>';
    const stoppedRow = '<tr><td colspan="5" class="status-empty">구독이 중단되었습니다</td></tr>';
    const loadingRow = '<tr><td colspan="5" class="status-empty">불러오는 중...</td></tr>';

    window.startRanking = function() {
        if (rankingActive) return;
        if (rankDataScope === 'main' && !canViewMainRank) {
            setStatusText('메인 TOP100 열람 권한이 없습니다.');
            return;
        }
        if (rankDataScope === 'challenge' && !canViewChallengeRank) {
            setStatusText('챌린지 TOP100 열람 권한이 없습니다.');
            return;
        }
        rankingPausedForHidden = false;
        const tbodyS   = document.getElementById('ranking-tbody-stock');
        const tbodyC   = document.getElementById('ranking-tbody-coin');
        const badge    = document.getElementById('live-badge');
        const countEl  = document.getElementById('stock-count');
        const countCoin = document.getElementById('coin-count');

        tbodyS.innerHTML = loadingRow;
        tbodyC.innerHTML = loadingRow;
        setStatusText('구독 중...');
        badge.style.display  = 'flex';
        rankingActive = true;
        setStatusText(rankDataScope === 'challenge' ? '실시간 구독 중 · 챌린지 TOP100' : '실시간 구독 중 · 메인 TOP100');

        stockTopUnsub = onValue(ref(db, rankStocksPath()), (snap) => {
            if (!snap.exists()) {
                tbodyS.innerHTML = emptyRow;
                countEl.textContent = '주식 0종목';
            } else {
                const stocks = Array.isArray(snap.val()) ? snap.val() : [];
                countEl.textContent = `주식 ${stocks.length}종목`;
                tbodyS.innerHTML = stocks.length ? buildRankingRows(stocks, '원', false) : emptyRow;
            }
            touchTime();
            setStatusText(rankDataScope === 'challenge' ? '실시간 구독 중 · 챌린지 TOP100' : '실시간 구독 중 · 메인 TOP100');
        });

        if (rankDataScope === 'challenge') {
            if (tbodyC) tbodyC.innerHTML = '<tr><td colspan="5" class="status-empty">챌린지 모드는 주식 랭킹만 제공합니다</td></tr>';
            if (countCoin) countCoin.textContent = '코인 비활성';
        } else {
            coinTopUnsub = onValue(ref(db, rankCoinsPath()), (snap) => {
                if (!snap.exists()) {
                    tbodyC.innerHTML = emptyRow;
                    countCoin.textContent = '코인 0종목';
                } else {
                    const coins = Array.isArray(snap.val()) ? snap.val() : [];
                    countCoin.textContent = `코인 ${coins.length}종목`;
                    tbodyC.innerHTML = coins.length ? buildRankingRows(coins, '원', true) : emptyRow;
                }
                touchTime();
                setStatusText(rankDataScope === 'challenge' ? '실시간 구독 중 · 챌린지 TOP100' : '실시간 구독 중 · 메인 TOP100');
            });
        }

        metaUnsub = onValue(ref(db, rankMetaPath()), (snap) => {
            const ts = Number(snap.val());
            if (Number.isFinite(ts) && ts > 0) touchTime(ts);
        });
    };

    window.stopRanking = function() {
        stopSubscriptionsOnly();
        rankingPausedForHidden = false;
        const badge     = document.getElementById('live-badge');
        const tbodyS    = document.getElementById('ranking-tbody-stock');
        const tbodyC    = document.getElementById('ranking-tbody-coin');
        const countEl   = document.getElementById('stock-count');
        const countCoin = document.getElementById('coin-count');
        const updateEl  = document.getElementById('update-time');
        if (badge) badge.style.display = 'none';
        setStatusText('구독 중단됨');
        if (tbodyS) tbodyS.innerHTML = stoppedRow;
        if (tbodyC) tbodyC.innerHTML = stoppedRow;
        if (countEl) countEl.textContent = '-';
        if (countCoin) countCoin.textContent = '-';
        if (updateEl) updateEl.textContent = '-';
    };

    document.addEventListener('visibilitychange', () => {
        const badge = document.getElementById('live-badge');
        if (document.visibilityState === 'hidden') {
            if (!rankingActive) return;
            stopSubscriptionsOnly();
            stopAutoScrollTimer();
            rankingPausedForHidden = true;
            setStatusText('백그라운드 절전 모드');
            if (badge) badge.style.display = 'none';
            return;
        }
        if (!rankingPausedForHidden) return;
        rankingPausedForHidden = false;
        window.startRanking();
    });

    // ── 자동 스크롤 ──────────────────────────────────────────
    let autoScrollEnabled  = true;
    let autoScrollTimer    = null;
    let userScrollTimer    = null;
    let scrollDirection    = 1; // 1: 아래, -1: 위
    const SCROLL_SPEED     = 1;    // px per tick
    const SCROLL_INTERVAL  = 30;   // ms
    const PAUSE_ON_INTERACT = 4000; // 조작 후 재개까지 대기(ms)
    const BOTTOM_PAUSE     = 2000; // 하단 도달 후 방향 전환 대기(ms)

    function startAutoScroll() {
        stopAutoScrollTimer();
        const wrap = document.getElementById('dual-rank-scroll');
        if (!wrap) return;

        autoScrollTimer = setInterval(() => {
            if (!autoScrollEnabled) return;
            const atBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2;
            const atTop    = wrap.scrollTop <= 0;

            if (scrollDirection === 1 && atBottom) {
                // 하단 도달 → 잠깐 멈췄다 위로
                stopAutoScrollTimer();
                setTimeout(() => {
                    scrollDirection = -1;
                    startAutoScroll();
                }, BOTTOM_PAUSE);
                return;
            }
            if (scrollDirection === -1 && atTop) {
                // 상단 도달 → 잠깐 멈췄다 아래로
                stopAutoScrollTimer();
                setTimeout(() => {
                    scrollDirection = 1;
                    startAutoScroll();
                }, BOTTOM_PAUSE);
                return;
            }
            wrap.scrollTop += SCROLL_SPEED * scrollDirection;
        }, SCROLL_INTERVAL);
    }

    function stopAutoScrollTimer() {
        if (autoScrollTimer) { clearInterval(autoScrollTimer); autoScrollTimer = null; }
    }

    function updateAutoScrollBadge() {
        const badge = document.getElementById('auto-scroll-badge');
        const label = document.getElementById('auto-scroll-label');
        if (!badge || !label) return;
        if (autoScrollEnabled) {
            badge.classList.remove('paused');
            label.textContent = '자동 스크롤';
        } else {
            badge.classList.add('paused');
            label.textContent = '스크롤 정지';
        }
    }

    window.toggleAutoScroll = function() {
        autoScrollEnabled = !autoScrollEnabled;
        updateAutoScrollBadge();
        if (autoScrollEnabled) startAutoScroll();
        else stopAutoScrollTimer();
    };

    // 유저가 직접 스크롤하면 자동 스크롤 일시 중단 후 재개
    document.getElementById('dual-rank-scroll')?.addEventListener('wheel', () => {
        if (!autoScrollEnabled) return;
        stopAutoScrollTimer();
        clearTimeout(userScrollTimer);
        userScrollTimer = setTimeout(() => {
            if (autoScrollEnabled) startAutoScroll();
        }, PAUSE_ON_INTERACT);
    }, { passive: true });

    document.getElementById('dual-rank-scroll')?.addEventListener('touchmove', () => {
        if (!autoScrollEnabled) return;
        stopAutoScrollTimer();
        clearTimeout(userScrollTimer);
        userScrollTimer = setTimeout(() => {
            if (autoScrollEnabled) startAutoScroll();
        }, PAUSE_ON_INTERACT);
    }, { passive: true });

    // 구독 시작 시 자동 스크롤도 시작
    const _origStart = window.startRanking;
    window.startRanking = function() {
        _origStart();
        setTimeout(() => startAutoScroll(), 500);
    };

    // 페이지 로드 시 초기화
    updateAutoScrollBadge();
    applyRankMarketView();
    applyRankDataScopeButtons();
    window.addEventListener('resize', applyRankMarketView);

    // Ctrl+Enter: 리스트 전용 전체화면 토글
    function toggleFocusListOnlyMode() {
        document.body.classList.toggle('focus-list-only');
    }
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            toggleFocusListOnlyMode();
        }
    });
</script>
</body>
</html>
