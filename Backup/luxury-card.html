<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Navy Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── 토큰 ── */
:root {
  --n950: #020d1a;
  --n900: #041628;
  --n800: #0a2540;
  --n700: #0f3460;
  --n600: #16457a;
  --n500: #1b5499;
  --n400: #2d72c8;
  --n300: #5a9be0;
  --n200: #93bfee;
  --n100: #cde0f8;
  --n50:  #eaf3fd;
  --gold:    #c9a84c;
  --gold-lt: #e8c97a;
  --gold-dk: #a87d2a;
  --wh:      #f5f8fc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #08111e;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1rem;
}

/* ── 카드 래퍼 ── */
.card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 360px;
  background: var(--n950);
  border: 0.5px solid rgba(201, 168, 76, 0.3);
  border-radius: 22px;
  padding: 2rem;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition:
    transform  .4s cubic-bezier(.22, 1, .36, 1),
    border-color .35s ease,
    box-shadow .4s ease;
}

.card:hover {
  transform: translateY(-7px) scale(1.015);
  border-color: rgba(201, 168, 76, 0.65);
  box-shadow:
    0 24px 64px rgba(2, 13, 26, 0.75),
    0 0  40px rgba(201, 168, 76, 0.07);
}

/* ── 상단 골드 라인 ── */
.gold-top {
  position: absolute;
  top: 0;
  left: 2.5rem;
  right: 2.5rem;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transition: left .4s ease, right .4s ease;
}

.card:hover .gold-top {
  left: 0.75rem;
  right: 0.75rem;
}

/* ── 파티클 캔버스 ── */
.particle-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 22px;
}

/* ── 스포트라이트 ── */
.spotlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 22px;
  background: radial-gradient(circle 180px at 50% 50%, rgba(201, 168, 76, 0.07) 0%, transparent 70%);
  opacity: 0;
  transition: opacity .3s ease;
}

.card:hover .spotlight {
  opacity: 1;
}

/* ── 아이콘 ── */
.lux-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: rgba(201, 168, 76, 0.1);
  border: 0.5px solid rgba(201, 168, 76, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.4rem;
  color: var(--gold-lt);
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  position: relative;
  z-index: 1;
  transition: background .3s, transform .35s, border-color .3s;
}

.card:hover .lux-icon {
  background: rgba(201, 168, 76, 0.22);
  border-color: rgba(201, 168, 76, 0.6);
  transform: rotate(8deg) scale(1.1);
}

/* ── 태그 배지 ── */
.tag {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-lt);
  border: 0.5px solid rgba(201, 168, 76, 0.35);
  border-radius: 4px;
  padding: 3px 9px;
  margin-bottom: 1.25rem;
  position: relative;
  z-index: 1;
  transition: background .25s, border-color .25s;
}

.card:hover .tag {
  background: rgba(201, 168, 76, 0.13);
  border-color: rgba(201, 168, 76, 0.65);
}

/* ── 제목 ── */
.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 28px;
  line-height: 1.25;
  color: var(--wh);
  margin-bottom: 0.6rem;
  position: relative;
  z-index: 1;
  transition: letter-spacing .35s ease;
}

.card:hover .card-title {
  letter-spacing: 0.015em;
}

/* ── 설명 텍스트 ── */
.card-desc {
  font-size: 12.5px;
  font-weight: 300;
  color: rgba(245, 248, 252, 0.45);
  line-height: 1.65;
  margin-bottom: 1.6rem;
  position: relative;
  z-index: 1;
}

/* ── 구분선 ── */
.divider {
  border: none;
  border-top: 0.5px solid rgba(201, 168, 76, 0.15);
  margin-bottom: 1.4rem;
}

/* ── 기능 목록 ── */
.features {
  list-style: none;
  margin-bottom: 1.5rem;
  position: relative;
  z-index: 1;
}

.features li {
  font-size: 12px;
  color: rgba(245, 248, 252, 0.5);
  padding: 5px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color .2s;
}

.card:hover .features li {
  color: rgba(245, 248, 252, 0.65);
}

.features li::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.5;
  flex-shrink: 0;
  transition: opacity .2s;
}

.card:hover .features li::before {
  opacity: 1;
}

/* ── 가격 행 ── */
.price-row {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-bottom: 1.4rem;
  position: relative;
  z-index: 1;
}

.currency {
  font-size: 14px;
  color: var(--gold);
  font-weight: 400;
}

.price {
  font-size: 36px;
  font-weight: 300;
  color: var(--wh);
  transition: color .3s ease;
}

.card:hover .price {
  color: var(--gold-lt);
}

.period {
  font-size: 12px;
  color: rgba(245, 248, 252, 0.3);
}

/* ── 버튼 ── */
.btn-gold {
  display: block;
  width: 100%;
  text-align: center;
  padding: 11px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dk));
  color: var(--n950);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.05em;
  cursor: pointer;
  border: none;
  position: relative;
  z-index: 1;
  transition: filter .25s, transform .2s, box-shadow .25s;
}

.btn-gold:hover {
  filter: brightness(1.12);
  transform: scale(1.025);
  box-shadow: 0 4px 20px rgba(201, 168, 76, 0.25);
}
</style>
</head>
<body>

<div class="card" id="luxCard">
  <canvas class="particle-canvas" id="pCanvas"></canvas>
  <div class="spotlight" id="spotlight"></div>
  <div class="gold-top"></div>

  <div class="lux-icon">◈</div>
  <span class="tag">Private Suite</span>
  <h2 class="card-title">Exclusive<br>Membership</h2>
  <p class="card-desc">독점 회원 전용 서비스. 맞춤형 컨시어지와 24시간 프리미엄 케어.</p>
  <hr class="divider">

  <ul class="features">
    <li>무제한 컨시어지 서비스</li>
    <li>전용 라운지 &amp; VIP 라인</li>
    <li>월간 프리미엄 리포트</li>
  </ul>

  <div class="price-row">
    <span class="currency">₩</span>
    <span class="price">890</span>
    <span class="period">/ 월</span>
  </div>

  <button class="btn-gold">지금 시작하기</button>
</div>

<script>
/* ── 골드 파티클 시스템 ── */
(function () {
  const card      = document.getElementById('luxCard');
  const canvas    = document.getElementById('pCanvas');
  const spotlight = document.getElementById('spotlight');
  const ctx       = canvas.getContext('2d');
  let W, H, particles = [], lastSpawn = 0;

  /* 캔버스 크기 동기화 */
  function resize() {
    W = canvas.width  = card.offsetWidth;
    H = canvas.height = card.offsetHeight;
  }
  resize();
  new ResizeObserver(resize).observe(card);

  /* 골드 팔레트 */
  const GOLD = [
    'rgba(232,201,122,',
    'rgba(201,168,76,',
    'rgba(255,225,140,',
    'rgba(168,125,42,',
    'rgba(255,210,100,',
  ];

  /* 파티클 생성 */
  function spawn(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.3 + Math.random() * 1.4;
      const size  = 1   + Math.random() * 2.8;
      const life  = 60  + Math.random() * 80;
      particles.push({
        x, y,
        vx:    Math.cos(angle) * speed + (Math.random() - 0.5) * 0.4,
        vy:    Math.sin(angle) * speed - 0.5 - Math.random() * 0.8,
        size,
        life,
        maxLife: life,
        color:  GOLD[Math.floor(Math.random() * GOLD.length)],
        rot:    Math.random() * Math.PI * 2,
        rotV:   (Math.random() - 0.5) * 0.12,
        shape:  Math.random() > 0.55 ? 'circle' : 'diamond',
      });
    }
  }

  /* 다이아몬드 도형 */
  function drawDiamond(cx, cy, r, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(r, 0);
    ctx.lineTo(0,  r); ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.restore();
  }

  /* 매 프레임 렌더 */
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.025;   /* 중력 */
      p.vx *= 0.992;   /* 공기저항 */
      p.rot += p.rotV;
      p.life--;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      const progress = p.life / p.maxLife;
      const alpha    = progress < 0.25 ? progress / 0.25 : progress;
      const sz       = p.size * (progress < 0.15 ? progress / 0.15 : 1);

      ctx.beginPath();
      if (p.shape === 'diamond') drawDiamond(p.x, p.y, sz, p.rot);
      else ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
      ctx.fillStyle = p.color + (alpha * 0.72) + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();

  /* 이벤트 */
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;

    spotlight.style.background =
      `radial-gradient(circle 200px at ${x}px ${y}px, rgba(201,168,76,.09) 0%, transparent 70%)`;

    const now = Date.now();
    if (now - lastSpawn > 30) {
      spawn(x, y, 2 + Math.floor(Math.random() * 2));
      lastSpawn = now;
    }
  });

  card.addEventListener('mouseenter', e => {
    const r = card.getBoundingClientRect();
    spawn(e.clientX - r.left, e.clientY - r.top, 14);
  });

  card.addEventListener('mouseleave', () => {
    spotlight.style.background = '';
  });

  card.addEventListener('click', e => {
    const r = card.getBoundingClientRect();
    spawn(e.clientX - r.left, e.clientY - r.top, 30);
  });
})();
</script>

</body>
</html>
