
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Gaegu:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pk1:#fff0f6;--pk2:#ffd6e8;--pk3:#ffadd2;--pk4:#f759ab;--pk5:#c41d7f;
  --lv1:#f9f0ff;--lv2:#efdbff;--lv3:#d3adf7;--lv4:#9254de;--lv5:#531dab;
  --yw1:#fffbe6;--yw2:#fff1b8;--yw3:#ffd666;--yw4:#faad14;
  --mt1:#f0fff4;--mt2:#d9f7be;--mt3:#95de64;--mt4:#52c41a;
  --bg:#fdf6ff;--wh:#fff;
  --txt:#3d2c4e;--txt2:#7c5fa0;--txt3:#b09ec5;
}
body{font-family:'Nunito',sans-serif;background:transparent}

.phone{
  max-width:380px;margin:1rem auto 2rem;
  background:var(--bg);border-radius:32px;
  border:2px solid var(--lv2);overflow:hidden;
  box-shadow:0 8px 32px rgba(146,84,222,.1);
}

/* header */
.ph-head{
  background:var(--wh);padding:14px 16px 12px;
  border-bottom:1.5px solid var(--pk2);
  display:flex;align-items:center;gap:10px;
}
.ph-back{width:28px;height:28px;border-radius:50%;background:var(--lv2);
  display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ph-back:hover{transform:scale(1.15)}
.ph-ava{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--pk3),var(--lv3));
  display:flex;align-items:center;justify-content:center;
  font-family:'Gaegu',cursive;font-size:16px;color:var(--wh);font-weight:700;
  border:2px solid var(--wh);flex-shrink:0;position:relative}
.ph-ava .online{position:absolute;bottom:0;right:0;width:9px;height:9px;
  border-radius:50%;background:var(--mt4);border:2px solid var(--wh)}
.ph-info{flex:1;min-width:0}
.ph-name{font-size:14px;font-weight:800;color:var(--txt)}
.ph-status{font-size:11px;color:var(--mt4);font-weight:600}
.ph-actions{display:flex;gap:6px}
.ph-btn{width:28px;height:28px;border-radius:50%;background:var(--lv1);border:1.5px solid var(--lv2);
  display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s}
.ph-btn:hover{transform:scale(1.15);background:var(--lv2)}

/* chat area */
.chat-area{padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:320px}

.date-divider{text-align:center;font-size:10px;font-weight:700;color:var(--txt3);
  letter-spacing:.08em;margin:4px 0}

/* bubbles */
.bubble-row{display:flex;align-items:flex-end;gap:7px}
.bubble-row.me{flex-direction:row-reverse}
.mini-ava{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pk3),var(--lv3));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--wh);font-weight:700}
.bubble{
  max-width:68%;padding:9px 13px;border-radius:18px;
  font-size:13px;line-height:1.5;font-weight:600;position:relative;
  transition:transform .15s;cursor:default;
}
.bubble:hover{transform:scale(1.02)}
.bubble.them{
  background:var(--wh);color:var(--txt);
  border:1.5px solid var(--pk2);border-bottom-left-radius:4px;
}
.bubble.me{
  background:linear-gradient(135deg,var(--pk3),var(--lv3));
  color:var(--wh);border-bottom-right-radius:4px;
}
.bubble .ts{display:block;font-size:10px;font-weight:600;margin-top:3px;opacity:.6;text-align:right}
.bubble.them .ts{text-align:left}

/* reaction */
.bubble-wrap{display:flex;flex-direction:column;gap:2px}
.reaction{font-size:12px;padding:2px 6px;background:var(--wh);border:1.5px solid var(--pk2);
  border-radius:10px;align-self:flex-start;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.reaction:hover{transform:scale(1.2)}
.me .reaction{align-self:flex-end}

/* image bubble */
.img-bubble{
  width:140px;height:90px;border-radius:16px;
  background:linear-gradient(135deg,var(--yw2),var(--pk2));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;border:1.5px solid var(--pk2);cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.img-bubble:hover{transform:scale(1.04) rotate(-1deg)}

/* typing indicator */
.typing{display:flex;align-items:center;gap:4px;padding:10px 13px;
  background:var(--wh);border:1.5px solid var(--pk2);border-radius:18px;
  border-bottom-left-radius:4px;align-self:flex-start;width:fit-content}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--pk3);display:block}
.typing span:nth-child(1){animation:bup .9s .0s infinite}
.typing span:nth-child(2){animation:bup .9s .15s infinite}
.typing span:nth-child(3){animation:bup .9s .3s infinite}
@keyframes bup{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* sticker */
.sticker{font-size:36px;cursor:pointer;display:inline-block;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sticker:hover{transform:rotate(-12deg) scale(1.3)}

/* input bar */
.input-bar{
  background:var(--wh);border-top:1.5px solid var(--pk2);
  padding:10px 12px;display:flex;flex-direction:column;gap:8px;
}

/* emoji quick row */
.emoji-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.emoji-row::-webkit-scrollbar{display:none}
.eq{font-size:18px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1);padding:2px 3px;border-radius:8px;flex-shrink:0}
.eq:hover{transform:scale(1.35) rotate(-8deg)}

/* main input row */
.input-row{display:flex;align-items:center;gap:8px}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:6px;
  background:var(--pk1);border:1.5px solid var(--pk2);border-radius:24px;
  padding:7px 12px;transition:border-color .2s,box-shadow .2s;
}
.input-wrap:focus-within{border-color:var(--pk3);box-shadow:0 0 0 3px rgba(255,173,210,.25)}
.input-wrap input{
  flex:1;border:none;background:transparent;outline:none;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:var(--txt);
  min-width:0;
}
.input-wrap input::placeholder{color:var(--txt3);font-weight:600}
.ico-btn{font-size:16px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.ico-btn:hover{transform:scale(1.3) rotate(-10deg)}

/* send button */
.send-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pk4),var(--lv4));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .2s;
}
.send-btn:hover{transform:scale(1.12) rotate(-5deg);filter:brightness(1.1)}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* plus button */
.plus-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--lv1);border:1.5px solid var(--lv2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--lv4);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s;
}
.plus-btn:hover{transform:rotate(45deg) scale(1.1);background:var(--lv2)}

/* attachment preview */
.attach-row{display:flex;gap:6px;padding:0 2px}
.attach-chip{
  display:flex;align-items:center;gap:5px;
  background:var(--pk1);border:1.5px solid var(--pk2);border-radius:12px;
  padding:4px 10px;font-size:11px;font-weight:700;color:var(--pk5);cursor:pointer;
  transition:transform .2s;
}
.attach-chip:hover{transform:scale(1.05)}
.attach-chip .x{font-size:13px;color:var(--pk3);margin-left:2px}
</style>

<div class="phone">

  <div class="ph-head">
    <div class="ph-back">‹</div>
    <div class="ph-ava">하<div class="online"></div></div>
    <div class="ph-info">
      <div class="ph-name">하나비 ✦</div>
      <div class="ph-status">지금 접속 중</div>
    </div>
    <div class="ph-actions">
      <div class="ph-btn">📞</div>
      <div class="ph-btn">⋯</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="date-divider">오늘</div>

    <div class="bubble-row">
      <div class="mini-ava">하</div>
      <div class="bubble-wrap">
        <div class="bubble them">안녕! 오늘 뭐해? 🌸<span class="ts">오후 2:14</span></div>
        <div class="reaction">🍓 2</div>
      </div>
    </div>

    <div class="bubble-row me">
      <div class="bubble-wrap">
        <div class="bubble me">나 지금 카페에 있어 ☕️<span class="ts">2:16</span></div>
      </div>
    </div>

    <div class="bubble-row">
      <div class="mini-ava">하</div>
      <div class="bubble them">
        <div class="img-bubble">🎨</div>
        <span class="ts">2:17</span>
      </div>
    </div>

    <div class="bubble-row me">
      <div class="bubble-wrap">
        <div class="bubble me">완전 귀여워!!!<span class="ts">2:18</span></div>
        <div class="bubble me" style="margin-top:3px">이따 같이 저녁 먹을까? 🍜<span class="ts">2:18</span></div>
      </div>
    </div>

    <div class="bubble-row">
      <div class="mini-ava">하</div>
      <div style="padding:4px 0 2px 0">
        <span class="sticker">🐰</span>
      </div>
    </div>

    <div class="bubble-row">
      <div class="mini-ava">하</div>
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="emoji-row">
      <span class="eq">😊</span><span class="eq">🥰</span><span class="eq">🍓</span>
      <span class="eq">✨</span><span class="eq">🎀</span><span class="eq">🌸</span>
      <span class="eq">💜</span><span class="eq">🐰</span><span class="eq">🍰</span>
      <span class="eq">☕</span><span class="eq">🎨</span><span class="eq">🌈</span>
    </div>

    <div class="attach-row">
      <div class="attach-chip"><span>📎</span> 이미지.png <span class="x">×</span></div>
    </div>

    <div class="input-row">
      <div class="plus-btn">+</div>
      <div class="input-wrap">
        <span class="ico-btn">😊</span>
        <input type="text" placeholder="메시지를 입력해줘 ✦" id="chatInput"/>
        <span class="ico-btn">🎀</span>
      </div>
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
(function(){
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatArea = document.querySelector('.chat-area');

  function addBubble(text){
    const row = document.createElement('div');
    row.className = 'bubble-row me';
    const now = new Date();
    const t = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    row.innerHTML = `<div class="bubble-wrap"><div class="bubble me">${text}<span class="ts">${t}</span></div></div>`;
    const typing = chatArea.querySelector('.bubble-row:last-child');
    chatArea.insertBefore(row, typing);
    chatArea.scrollTop = chatArea.scrollHeight;
    row.style.opacity='0';row.style.transform='translateY(10px)';
    setTimeout(()=>{row.style.transition='opacity .25s,transform .3s';row.style.opacity='1';row.style.transform='translateY(0)'},10);
  }

  sendBtn.addEventListener('click',()=>{
    const v = input.value.trim();
    if(!v) return;
    addBubble(v);
    input.value='';
  });

  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); sendBtn.click(); }
  });

  document.querySelectorAll('.eq').forEach(e=>{
    e.addEventListener('click',()=>{ input.value += e.textContent; input.focus(); });
  });
})();
</script>
